server:
  port: 8080

spring:
  # --- JPA 和主数据源 (app_data.sqlite) 配置 ---
  datasource:
    # 测试环境使用内存数据库
    url: jdbc:sqlite:target/test-app.db
    driver-class-name: org.sqlite.JDBC
    
  jpa:
    hibernate:
      # 自动根据 Entity 更新或创建表结构
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # 必须为 SQLite 指定方言
        dialect: org.hibernate.community.dialect.SQLiteDialect
        # 优化 SQLite 的批量插入/更新
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# --- 自定义配置 ---
app:
  dictionary:
    enabled: false
    datasource:
      # 测试只需验证上下文可启动，不依赖 392 MB 的生产词典文件。
      url: jdbc:sqlite:file:test-dictionary?mode=memory&cache=shared
      driver-class-name: org.sqlite.JDBC
