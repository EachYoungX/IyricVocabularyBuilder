server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${APP_DATA_DB_URL:${APP_DB_URL:jdbc:sqlite:data/app_data.db}}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

app:
  version: "@project.version@"
  web:
    root: ${APP_WEB_ROOT:}
  desktop:
    mode: ${APP_DESKTOP_MODE:false}
    shutdown-token: ${APP_DESKTOP_SHUTDOWN_TOKEN:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9000,http://127.0.0.1:9000}
  dictionary:
    enabled: ${APP_DICTIONARY_ENABLED:false}
    datasource:
      url: ${APP_DICTIONARY_DB_URL:jdbc:sqlite:file:dictionary-disabled?mode=memory&cache=shared}
      driver-class-name: org.sqlite.JDBC
