server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${APP_DB_URL:jdbc:sqlite:data/app_data.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

app:
  version: "@project.version@"
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9000,http://127.0.0.1:9000}
  dictionary:
    enabled: ${APP_DICTIONARY_ENABLED:false}
    datasource:
      url: ${APP_DICTIONARY_DB_URL:jdbc:sqlite:file:dictionary-disabled?mode=memory&cache=shared}
      driver-class-name: org.sqlite.JDBC
