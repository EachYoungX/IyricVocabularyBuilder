openapi: 3.1.0
info:
  title: Lyric Vocabulary Builder API
  description: |-
    英语歌词词汇构建器应用程序的后台 API。
    用于管理英文歌曲库、构建词汇索引并提供英英词典查询，专为英语学习设计。

    Backend API for the Lyric Vocabulary Builder application (English learning only).

    所有包含响应体的接口统一返回 `{ code, message, data }`。本文档中的成功响应 schema
    描述 `data` 字段的业务内容；前端生成客户端会在传输层自动解包该字段。

    All responses with a body use the `{ code, message, data }` envelope. Successful
    response schemas below describe the business payload inside `data`; the generated
    frontend transport unwraps this field automatically.
  version: 1.3.0

servers:
  - url: http://localhost:8080
    description: 本地开发服务器 / Local development server

tags:
  - name: Vocabulary
    description: 词汇索引相关操作 / Vocabulary index operations
  - name: Songs
    description: 英文歌曲库管理 / English song library management
  - name: Dictionary
    description: 英英词典查询（仅英文） / English dictionary lookup
  - name: Lyrics
    description: 歌词标准化、结构化与用户修正 / Lyric normalization, structuring, and correction
  - name: Phrases
    description: 正式词典短语与上下文命中 / Dictionary phrases and contextual matches
  - name: UserVocabulary
    description: 个人词库、统计与复习 / Personal vocabulary, stats, and review

paths:
  # ===============================================================
  # Vocabulary Endpoints
  # ===============================================================
  /api/vocabulary/words:
    get:
      tags: [Vocabulary]
      summary: 获取唯一单词分页列表 / Get paginated unique words
      description: |-
        返回所有英文歌词中提取的唯一单词（已排序、不区分大小写去重），支持前缀过滤和分页。
      operationId: getWordList
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          description: 前缀过滤（不区分大小写） / Case-insensitive prefix filter
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 页码（从0开始） / Page number (0-indexed)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: 每页条数 / Page size
        - name: recommendedOnly
          in: query
          schema:
            type: boolean
            default: true
          description: 是否只返回推荐学习词 / Whether to return recommended words only
        - name: lemmaSearch
          in: query
          schema:
            type: boolean
            default: true
          description: 是否使用词形归一搜索 / Whether to use lemmatized search
      responses:
        '200':
          description: 分页单词列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Vocabulary]
      summary: 批量删除词汇索引项 / Delete vocabulary index words
      description: 删除词汇索引中的指定词条，不删除歌曲原文。
      operationId: deleteVocabularyWords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyBulkWordsRequest'
      responses:
        '200':
          description: 实际删除数量
          content:
            application/json:
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/vocabulary/words/{word}/occurrences:
    get:
      tags: [Vocabulary]
      summary: 获取单词出现位置 / Get word occurrences in lyrics
      operationId: getWordOccurrences
      parameters:
        - name: word
          in: path
          required: true
          description: 要查询的英文单词（不区分大小写）
          schema:
            type: string
      responses:
        '200':
          description: 出现位置列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WordOccurrence'
        '404':
          description: 词汇表中未找到该单词
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/vocabulary/words/{word}/learning-value:
    patch:
      tags: [Vocabulary]
      summary: 手动更新词条学习价值 / Manually update word learning value
      description: 将词条标记为推荐学习或低学习价值，不删除歌曲原文。
      operationId: updateVocabularyLearningValue
      parameters:
        - name: word
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyLearningValueRequest'
      responses:
        '200':
          description: 更新后的词条摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyQualityCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vocabulary/quality-candidates:
    get:
      tags: [Vocabulary]
      summary: 获取词库清洗候选 / Get vocabulary cleanup candidates
      description: 返回疑似低学习价值或异常词条，用于人工确认后清洗。
      operationId: getVocabularyQualityCandidates
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 80
      responses:
        '200':
          description: 词库清洗候选
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VocabularyQualityCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/vocabulary/refresh:
    post:
      tags: [Vocabulary]
      summary: 重新构建词汇索引 / Rebuild vocabulary index
      description: 触发异步任务重新从所有歌曲提取词汇索引
      operationId: refreshVocabularyIndex
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: 异步重建任务已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreationResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/vocabulary/refresh/tasks/{taskId}:
    get:
      tags: [Vocabulary]
      summary: 查询词汇索引刷新任务状态
      description: 根据任务 ID 查询词汇索引重建任务的当前进度和最终结果。
      operationId: getRefreshTaskStatus
      parameters:
        - name: taskId
          in: path
          required: true
          description: 从 /refresh 接口获取的任务 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 任务的当前状态或最终结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyRebuildTask'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user-vocabulary:
    post:
      tags: [UserVocabulary]
      summary: 加入个人词库 / Add a word to personal vocabulary
      operationId: addUserVocabularyWord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserVocabularyRequest'
      responses:
        '200':
          description: 已保存的个人词条 / Saved personal vocabulary item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVocabulary'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [UserVocabulary]
      summary: 查询个人词库 / List personal vocabulary
      operationId: listUserVocabularyWords
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VocabularyStatus'
      responses:
        '200':
          description: 个人词条列表 / Personal vocabulary items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserVocabulary'
    delete:
      tags: [UserVocabulary]
      summary: 清空个人词库 / Clear personal vocabulary
      operationId: clearUserVocabularyWords
      responses:
        '204':
          description: 清空成功 / Personal vocabulary cleared

  /api/user-vocabulary/{id}:
    patch:
      tags: [UserVocabulary]
      summary: 更新个人词条 / Update a personal vocabulary item
      operationId: updateUserVocabularyWord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserVocabularyUpdateRequest'
      responses:
        '200':
          description: 更新后的个人词条 / Updated personal vocabulary item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVocabulary'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [UserVocabulary]
      summary: 移出个人词库 / Remove a word from personal vocabulary
      operationId: deleteUserVocabularyWord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 移出成功 / Personal vocabulary item removed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user-vocabulary/stats:
    get:
      tags: [UserVocabulary]
      summary: 获取个人词汇统计 / Get personal vocabulary stats
      operationId: getUserVocabularyStats
      responses:
        '200':
          description: 个人词汇统计 / Personal vocabulary stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVocabularyStats'

  /api/user-vocabulary/review:
    get:
      tags: [UserVocabulary]
      summary: 获取待复习词条 / Get review queue
      operationId: getUserVocabularyReviewQueue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 待复习词条 / Review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserVocabularyReviewItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===============================================================
  # Songs Endpoints
  # ===============================================================
  /api/songs:
    get:
      tags: [Songs]
      summary: 获取所有歌曲 / Get all songs
      operationId: getAllSongs
      responses:
        '200':
          description: 歌曲列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Songs]
      summary: 新建歌曲 / Create song
      operationId: createSong
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongImportRequest'
      responses:
        '200':
          description: 新建成功 / Song created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/songs/import:
    post:
      tags: [Songs]
      summary: 异步批量导入歌曲（推荐方式）
      operationId: importSongsAsync
      parameters:
        - name: autoAddToPersonalVocabulary
          in: query
          schema:
            type: boolean
            default: false
          description: 导入后将常规英文词加入个人词库 / Add regular English words to personal vocabulary after import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SongImportRequest'
      responses:
        '202':
          description: 导入任务已接受，正在后台处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongImportTaskResponse'
              example:
                taskId: "1a2b3c4d-5678-90ef-..."
                total: 87
                message: "87 songs queued for import"

  /api/songs/import/tasks/{taskId}:
    get:
      tags: [Songs]
      summary: 查询导入任务完整结果（包含失败详情）
      operationId: getImportTaskResult
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            任务结束（无论成功还是部分失败）后，调用此接口可直接拿到**每首歌的成功/失败原因**。
            任务状态为 COMPLETED 或 FAILED 时返回完整详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResult'
              example:
                taskId: "1a2b3c4d-5678-90ef-..."
                status: COMPLETED
                total: 87
                successCount: 85
                failedCount: 2
                finishedAt: "2025-04-05T12:05:33Z"
                failedItems:
                  - index: 12
                    title: "Let It Be"
                    artist: "The Beatles"
                    error: "Song already exists (duplicate)"
                  - index: 56
                    title: ""
                    artist: "Taylor Swift"
                    error: "Title cannot be empty"
        '404':
          $ref: '#/components/responses/NotFound'

  /api/songs/batch:
    delete:
      tags: [Songs]
      summary: 批量删除歌曲 / Delete songs in batch
      operationId: deleteSongsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
      responses:
        '204':
          description: 批量删除成功 / Songs deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/songs/{id}:
    get:
      tags: [Songs]
      summary: 获取歌曲详情 / Get song details
      operationId: getSongById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 歌曲详情 / Song details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Songs]
      summary: 更新歌曲 / Update song
      operationId: updateSong
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags: [Songs]
      summary: 删除歌曲 / Delete song
      operationId: deleteSong
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /api/dictionary/{word}:
    get:
      tags: [Dictionary]
      summary: 查询英英词典 / Lookup English word
      operationId: lookupDictionaryWord
      parameters:
        - name: word
          in: path
          required: true
          description: 英文单词（不区分大小写）
          schema:
            type: string
          example: voyage
      responses:
        '200':
          description: 词典条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/songs/{songId}/lyrics:
    get:
      tags: [Lyrics]
      summary: 获取结构化歌词 / Get structured lyrics
      operationId: getStructuredLyrics
      parameters:
        - $ref: '#/components/parameters/SongId'
      responses:
        '200':
          description: 原始、标准化与逐行结构化歌词 / Raw, normalized, and structured lyrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricDocument'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/songs/{songId}/lyrics/import:
    post:
      tags: [Lyrics]
      summary: 导入或覆盖歌词 / Import or overwrite lyrics
      operationId: importLyrics
      parameters:
        - $ref: '#/components/parameters/SongId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricImportRequest'
      responses:
        '200':
          description: 导入后的结构化歌词 / Structured lyrics after import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 歌词内容不同且未允许覆盖 / Different lyrics without overwrite permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/songs/{songId}/lyrics/lines/{lineId}:
    put:
      tags: [Lyrics]
      summary: 修正歌词行 / Correct a lyric line
      operationId: updateLyricLine
      parameters:
        - $ref: '#/components/parameters/SongId'
        - name: lineId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricLineUpdateRequest'
      responses:
        '200':
          description: 已保存的用户修正 / Saved user correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricLine'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/lyrics/lines/{lineId}/tokens/{position}:
    get:
      tags: [Phrases]
      summary: 查询歌词 token 及关联短语 / Get token context and phrase matches
      operationId: getLyricTokenContext
      parameters:
        - name: lineId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: position
          in: path
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: token、词典条目与上下文短语
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LyricTokenContext'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/vocabulary/phrases:
    get:
      tags: [Phrases]
      summary: 分页查询歌曲中实际命中的正式短语 / Get paginated phrases matched in songs
      operationId: listPhrases
      parameters:
        - name: q
          in: query
          schema: {type: string}
          description: 在歌曲实际命中的短语中进行包含匹配 / Contains search among phrases matched in songs
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: 分页短语列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhrasePage'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/vocabulary/phrases/search:
    get:
      tags: [Phrases]
      summary: 搜索歌曲中实际命中的正式短语 / Search dictionary phrases matched in songs
      operationId: searchPhrases
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
          description: 在歌曲实际命中的短语中进行包含匹配 / Contains search among phrases matched in songs
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: 短语列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DictionaryPhrase'}

  /api/songs/{songId}/phrases:
    get:
      tags: [Phrases]
      summary: 查询歌曲中的正式短语 / Get phrases in a song
      operationId: getSongPhrases
      parameters: [{ $ref: '#/components/parameters/SongId' }]
      responses:
        '200':
          description: 歌曲短语命中
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PhraseMatch'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/vocabulary/phrases/{phraseId}/occurrences:
    get:
      tags: [Phrases]
      summary: 查询短语出现位置 / Get phrase occurrences
      operationId: getPhraseOccurrences
      parameters:
        - name: phraseId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: 短语出现位置列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PhraseOccurrence'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/songs/{songId}/phrases/refresh:
    post:
      tags: [Phrases]
      summary: 重建歌曲短语缓存 / Refresh song phrase cache
      operationId: refreshSongPhrases
      parameters: [{ $ref: '#/components/parameters/SongId' }]
      responses:
        '200': {description: 缓存已刷新}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/vocabulary/user-phrases:
    get:
      tags: [Phrases]
      summary: 查询用户短语 / List user phrases
      operationId: listUserPhrases
      responses:
        '200':
          description: 用户自定义短语
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserPhrase'}
    post:
      tags: [Phrases]
      summary: 添加用户短语 / Add a user phrase
      operationId: addUserPhrase
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPhraseRequest'}
      responses:
        '200':
          description: 已保存的用户短语
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPhrase'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/vocabulary/user-phrases/{id}:
    delete:
      tags: [Phrases]
      summary: 删除用户短语 / Delete a user phrase
      operationId: deleteUserPhrase
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: 已删除}
        '404': {$ref: '#/components/responses/NotFound'}

# ===============================================================
# Components
# ===============================================================
components:
  parameters:
    SongId:
      name: songId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 请求参数错误 / Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40001
            message: page must be >= 0
            data: null

    NotFound:
      description: 资源未找到 / Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40401
            message: Word 'xyzabc' not found in vocabulary
            data: null

    InternalError:
      description: 服务器内部错误 / Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 50000
            message: Internal server error
            data: null

  schemas:
    LyricLineType:
      type: string
      enum: [LYRIC, CREDIT, METADATA, SECTION_LABEL, SPEAKER_LABEL, PERFORMANCE_NOTE, META_INFO, EMPTY, UNKNOWN]

    LyricClassificationSource:
      type: string
      enum: [FORMAT, RULE, MANUAL, DEFAULT]

    LyricLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        lineIndex:
          type: integer
        originalText:
          type: string
        normalizedText:
          type: string
        lineType:
          $ref: '#/components/schemas/LyricLineType'
        classificationSource:
          $ref: '#/components/schemas/LyricClassificationSource'
        hidden:
          type: boolean
        confidence:
          type: number
          format: double
        userOverride:
          type: boolean
      required: [id, lineIndex, originalText, normalizedText, lineType, classificationSource, hidden, confidence, userOverride]

    LyricDocument:
      type: object
      properties:
        songId:
          type: integer
          format: int64
        title:
          type: string
        artist:
          type: string
        album:
          type: string
          nullable: true
        rawLyrics:
          type: string
        normalizedLyrics:
          type: string
        lyricsHash:
          type: string
        importVersion:
          type: integer
        updatedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LyricLine'
        credits:
          type: array
          items:
            $ref: '#/components/schemas/SongCredit'
      required: [songId, title, artist, rawLyrics, normalizedLyrics, lyricsHash, importVersion, updatedAt, lines, credits]

    LyricImportRequest:
      type: object
      properties:
        lyrics:
          type: string
        overwrite:
          type: boolean
          default: false
      required: [lyrics]

    LyricLineUpdateRequest:
      type: object
      properties:
        normalizedText:
          type: string
        lineType:
          $ref: '#/components/schemas/LyricLineType'
        hidden:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 40001
        message:
          type: string
        data:
          nullable: true
      required: [code, message, data]

    VocabularyRebuildTask:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
      required: [taskId, status, startedAt]

    WordPage:
      type: object
      properties:
        content:
          type: array
          items:
            type: string
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer
      required: [content, totalElements, totalPages, number, size]

    WordOccurrence:
      type: object
      properties:
        songId:
          type: integer
          format: int64
        songTitle:
          type: string
          example: "Yesterday"
        songArtist:
          type: string
          example: "The Beatles"
        lyricLineId:
          type: integer
          format: int64
          nullable: true
        lineIndex:
          type: integer
        lyricLine:
          type: string
          example: "Yesterday, all my troubles seemed so far away"
        surfaceForm:
          type: string
          example: "running"
        lemma:
          type: string
          example: "run"
        startOffset:
          type: integer
        endOffset:
          type: integer
        learningScore:
          type: number
          format: double
      required: [songTitle, lyricLine]

    PhrasePage:
      type: object
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/DictionaryPhrase'}
        totalElements: {type: integer}
        totalPages: {type: integer}
        number: {type: integer}
        size: {type: integer}
      required: [content, totalElements, totalPages, number, size]

    VocabularyQualityCandidate:
      type: object
      properties:
        word:
          type: string
        learningScore:
          type: number
          format: double
        occurrenceCount:
          type: integer
        songCount:
          type: integer
        recommended:
          type: boolean
        reasons:
          type: array
          items:
            type: string
            enum:
              - LOW_LEARNING_VALUE
              - PHRASE_CANDIDATE
              - CONTRACTION_PHRASE
              - POSSIBLE_TRUNCATED_LEMMA
              - VERY_SHORT_TOKEN
              - NON_STANDARD_TOKEN
        examples:
          type: array
          items:
            $ref: '#/components/schemas/WordOccurrence'
      required: [word, learningScore, occurrenceCount, songCount, recommended, reasons, examples]

    VocabularyBulkWordsRequest:
      type: object
      properties:
        words:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
      required: [words]

    VocabularyLearningValueRequest:
      type: object
      properties:
        recommended:
          type: boolean
      required: [recommended]

    VocabularyStatus:
      type: string
      enum: [NEW, LEARNING, FAMILIAR, MASTERED, BOOKMARK_ONLY, IGNORED]

    UserVocabularyRequest:
      type: object
      properties:
        lemma:
          type: string
          description: 单词或词形；后端会归一到 lemma / Word or surface form; normalized to lemma by backend
          example: running
        note:
          type: string
          nullable: true
      required: [lemma]

    UserVocabularyUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/VocabularyStatus'
        masteryScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
        note:
          type: string
          nullable: true

    UserVocabulary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: string
        lemma:
          type: string
        status:
          $ref: '#/components/schemas/VocabularyStatus'
        masteryScore:
          type: number
          format: double
        firstSeenAt:
          type: string
        lastSeenAt:
          type: string
        reviewDueAt:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
      required: [id, userId, lemma, status, masteryScore, firstSeenAt, lastSeenAt]

    UserVocabularyStats:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
        newCount:
          type: integer
          format: int64
        learningCount:
          type: integer
          format: int64
        familiarCount:
          type: integer
          format: int64
        masteredCount:
          type: integer
          format: int64
        ignoredCount:
          type: integer
          format: int64
        dueReviewCount:
          type: integer
          format: int64
        recentWords:
          type: array
          items:
            $ref: '#/components/schemas/UserVocabulary'
      required: [totalCount, newCount, learningCount, familiarCount, masteredCount, ignoredCount, dueReviewCount, recentWords]

    UserVocabularyReviewItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        lemma:
          type: string
        status:
          $ref: '#/components/schemas/VocabularyStatus'
        masteryScore:
          type: number
          format: double
        reviewDueAt:
          type: string
          nullable: true
        example:
          allOf:
            - $ref: '#/components/schemas/WordOccurrence'
          nullable: true
      required: [id, lemma, status, masteryScore]

    Song:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Yesterday"
        artist:
          type: string
          example: "The Beatles"
        album:
          type: string
          nullable: true
        rawTitle:
          type: string
          nullable: true
        rawArtist:
          type: string
          nullable: true
        rawSourceContent:
          type: string
          nullable: true
        lyrics:
          type: string
          example: "Yesterday, all my troubles seemed so far away\n..."
        credits:
          type: array
          items:
            $ref: '#/components/schemas/SongCredit'
      required: [id, title, artist, lyrics]

    SongCredit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        creditType:
          type: string
          enum: [LYRICIST, COMPOSER, PRODUCER, CO_PRODUCER, EXECUTIVE_PRODUCER, MIXING_ENGINEER, MASTERING_ENGINEER, ARRANGER, PERFORMER, VOCALS, GUITAR, BASS, DRUMS, PIANO, KEYBOARD, VIOLIN, FEATURING, OTHER]
        creditLabel:
          type: string
          nullable: true
        creditValue:
          type: string
        sourceLineId:
          type: integer
          format: int64
          nullable: true
        sortOrder:
          type: integer
      required: [creditType, creditValue]

    SongImportRequest:
      type: object
      properties:
        title:
          type: string
          example: "Bohemian Rhapsody"
        artist:
          type: string
          example: "Queen"
        album:
          type: string
          nullable: true
        rawSourceContent:
          type: string
          nullable: true
          description: 完整原始导入内容（可包含 LRC 元数据和时间戳）
        lyrics:
          type: string
      required: [title, artist, lyrics]

    SongImportTaskResponse:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        total:
          type: integer
          example: 87
        message:
          type: string
          example: "87 songs queued for import"
      required: [taskId]

    ImportTaskResult:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        total:
          type: integer
        successCount:
          type: integer
        failedCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        failedItems:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: 在本次提交的数组中的下标（前端可据此高亮显示）
              title:
                type: string
                nullable: true
              artist:
                type: string
                nullable: true
              lyricsSnippet:
                type: string
                nullable: true
              error:
                type: string
                example: "Title cannot be empty"
            required: [index, error]
      required:
        - taskId
        - status
        - total
        - successCount
        - failedCount

    SongUpdateRequest:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
          nullable: true
        lyrics:
          type: string

    DictionaryEntry:
      type: object
      properties:
        word:
          type: string
          example: "voyage"
        phonetic:
          type: string
          example: "/ˈvɔɪ.ɪdʒ/"
        definition:
          type: string
          example: "a long journey, especially by ship or in space"
        translation:
          type: string
          example: "航行；旅行"
        pos:
          type: string
          example: "noun, verb"
        collins:
          type: integer
        oxford:
          type: integer
        tags:
          type: string
        bnc:
          type: integer
        coca:
          type: integer
        frq:
          type: integer
      required: [word, definition]

    DictionaryPhrase:
      type: object
      properties:
        id: {type: integer, format: int64}
        sourcePattern: {type: string}
        canonicalPattern: {type: string}
        definitionEn: {type: string}
        definitionZh: {type: string}
        usageNoteZh: {type: string}
        phraseType: {type: string}
        source: {type: string}
        tokenCountMin: {type: integer}
        tokenCountMax: {type: integer}
        matchPriority: {type: integer}

    PhraseMatch:
      type: object
      properties:
        phraseId: {type: integer, format: int64}
        sourcePattern: {type: string}
        canonicalPattern: {type: string}
        definitionEn: {type: string}
        definitionZh: {type: string}
        usageNoteZh: {type: string}
        phraseType: {type: string}
        source: {type: string}
        startTokenPosition: {type: integer}
        endTokenPosition: {type: integer}
        surfacePhrase: {type: string}
        matchPriority: {type: integer}

    PhraseOccurrence:
      type: object
      properties:
        phraseId: {type: integer, format: int64}
        songId: {type: integer, format: int64}
        songTitle: {type: string}
        songArtist: {type: string}
        lyricLineId: {type: integer, format: int64}
        lineIndex: {type: integer}
        lyricLine: {type: string}
        startTokenPosition: {type: integer}
        endTokenPosition: {type: integer}
        surfacePhrase: {type: string}
      required: [songTitle, lyricLine, surfacePhrase]

    LyricTokenContext:
      type: object
      properties:
        lyricLineId: {type: integer, format: int64}
        tokenPosition: {type: integer}
        surfaceForm: {type: string}
        normalizedForm: {type: string}
        lemma: {type: string}
        lemmaStatus: {type: string}
        tokenType: {type: string}
        startOffset: {type: integer}
        endOffset: {type: integer}
        wordEntry: {$ref: '#/components/schemas/DictionaryEntry'}
        phraseMatches:
          type: array
          items: {$ref: '#/components/schemas/PhraseMatch'}

    UserPhraseRequest:
      type: object
      properties:
        canonicalPhrase: {type: string}
        definition: {type: string}
      required: [canonicalPhrase]

    UserPhrase:
      type: object
      properties:
        id: {type: integer, format: int64}
        userId: {type: string}
        canonicalPhrase: {type: string}
        definition: {type: string}
        createdAt: {type: string}

    TaskCreationResponse:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        message:
          type: string
      required: [taskId]
