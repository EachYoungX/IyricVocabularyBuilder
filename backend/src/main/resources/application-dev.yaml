# application.yaml (The Ultimate, Simplest Version)

server:
  port: 8080

# ===============================================
# SPRING BOOT OFFICIAL CONFIGURATION
# ===============================================
spring:
  # --- 主数据源 ---
  # 我们只为 Spring Boot 的自动配置提供主数据源
  datasource:
    url: jdbc:sqlite:data/app_data.db # 明确使用 data/ 目录
    driver-class-name: org.sqlite.JDBC

  # --- JPA 配置 ---
  jpa:
    hibernate:
      ddl-auto: none # 我们完全手动控制数据库初始化
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
    open-in-view: false

# ===============================================
# CUSTOM APPLICATION CONFIGURATION
# ===============================================
app:
  # --- 外部词典 (第二) 数据源；词典始终由运行环境单独提供 ---
  dictionary:
    enabled: ${APP_DICTIONARY_ENABLED:false}
    datasource:
      url: "${APP_DICTIONARY_DB_URL:jdbc:sqlite::memory:}"
      driver-class-name: org.sqlite.JDBC

# --- 自定义配置 ---
# 我们只在这里定义第二数据源的 URL

# --- 日志配置 ---
logging:
 level:
  org.springframework.jdbc.datasource.init: INFO
  org.hibernate.SQL: INFO
