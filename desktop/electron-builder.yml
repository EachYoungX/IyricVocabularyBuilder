appId: com.each17.lyricvocabularybuilder
productName: Lyric Vocabulary Builder
asar: true
afterPack: ./scripts/verify-package.mjs
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: .stage/backend
    to: backend
  - from: .stage/runtime
    to: runtime
  - from: .stage/web
    to: web
  - from: .stage/resources-manifest.json
    to: resources-manifest.json
win:
  executableName: LyricVocabularyBuilder
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lyric Vocabulary Builder
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: LyricVocabularyBuilder-Setup-${version}.${ext}
